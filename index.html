<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms Linh English — Handwriting Studio &amp; Ms Linh Workbook</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Vở tập viết tiếng Anh in ra giấy cho bé tiểu học (Global Success) · Printable English handwriting worksheets for kids">
<meta property="og:type" content="website">
<meta property="og:title" content="Ms Linh English · Vở tập viết tiếng Anh cho bé">
<meta property="og:description" content="Tô chữ, tập viết, in PDF A4 · Trace, write &amp; print A4 worksheets 🌈">
<meta property="og:url" content="https://vkas0812-sys.github.io/tlinh_enlish/">
<meta property="og:image" content="https://vkas0812-sys.github.io/tlinh_enlish/docs/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700&family=Playpen+Sans:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- APP HEADER -->
<header class="app-header">
  <div class="brand">
    <div class="brand-icon">✍️</div>
    <div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="brand-title">Ms Linh English</span>
        <span class="brand-badge">All-in-One Studio</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <button id="btn-print" class="btn btn-primary">🖨️ In / Xuất PDF (A4)</button>
  </div>
</header>

<!-- MAIN STUDIO -->
<main class="workspace">
  <!-- SIDEBAR CONTROLS -->
  <aside class="controls-panel">
    <!-- MODE TABS -->
    <div class="control-section">
      <span class="section-label">📚 Chọn Chế Độ Làm Việc</span>
      <div class="tabs-grid">
        <button class="tab-btn active" data-mode="workbook">📖 Vở Bài Tập (15 Trang)</button>
        <button class="tab-btn" data-mode="sentences">📝 Viết Câu</button>
        <button class="tab-btn" data-mode="alphabet">🔤 Bảng Chữ Cái</button>
        <button class="tab-btn" data-mode="custom">✏️ Soạn Thảo Tự Do</button>
      </div>
    </div>

    <!-- WORKBOOK PAGE SELECTOR -->
    <div class="control-section" id="sec-workbook-pages">
      <span class="section-label">📄 Trang Vở Bài Tập Ms Linh</span>
      <select id="select-workbook-page" class="select-input">
        <option value="all">📖 Toàn Bộ 15 Trang (In Trọn Bộ)</option>
        <option value="1" selected>Trang 1: Animals (cat, dog, duck, fish, frog)</option>
        <option value="2">Trang 2: Animals (goat, sheep, snake, spider, bird)</option>
        <option value="3">Trang 3: Numbers (1 - 5: one, two, three, four, five)</option>
        <option value="4">Trang 4: Numbers (6 - 10: six, seven, eight, nine, ten)</option>
        <option value="5">Trang 5: Numbers (11 - 15: eleven...fifteen)</option>
        <option value="6">Trang 6: Numbers (16 - 20: sixteen...twenty)</option>
        <option value="7">Trang 7: Colours (red, blue, yellow, green, orange)</option>
        <option value="8">Trang 8: Colours (pink, purple, brown, black, white)</option>
        <option value="9">Trang 9: Toys &amp; Things (ball, book, bike, boat, kite)</option>
        <option value="10">Trang 10: Clothes &amp; Home (shoe, sock, tree, football, toy)</option>
        <option value="11">Trang 11: Wild Animals (crocodile, elephant, giraffe, horse, mouse)</option>
        <option value="12">Trang 12: Adjectives &amp; Opposites (big, small, long, short, tall)</option>
        <option value="13">Trang 13: Clothes &amp; Wear (hat, dress, jacket, shirt, skirt)</option>
        <option value="14">Trang 14: Face &amp; Hair (eye, ear, nose, mouth, face, hair)</option>
        <option value="15">Trang 15: Body &amp; Limbs (head, arm, hand, leg, foot, body, tail)</option>
      </select>
    </div>

    <!-- SENTENCES / CUSTOM TEXT INPUT -->
    <div class="control-section" id="sec-custom-input" style="display: none;">
      <span class="section-label">✍️ Soạn Thảo Nội Dung</span>
      <textarea id="text-input" class="text-input" placeholder="Nhập từng câu hoặc từ luyện viết (mỗi dòng 1 câu)..."></textarea>
    </div>

    <!-- FONT SELECTOR -->
    <div class="control-section">
      <span class="section-label">🔠 Phông Chữ Nét Đứt / Chấm Bi</span>
      <select id="select-font" class="select-input">
        <option value="PrintDashed" selected>PrintDashed (Nét đứt chuẩn học đường Mỹ)</option>
        <option value="KgPrimaryDots">KgPrimaryDots (Chấm tròn mầm non &amp; tiểu học)</option>
        <option value="PrintClearly">PrintClearly (Nét liền chuẩn mực)</option>
        <option value="TraceFont">TraceFont (Nét gạch liền)</option>
      </select>
    </div>

    <!-- RULING METRICS -->
    <div class="control-section">
      <span class="section-label">📏 Căn Chỉnh Dòng Kẻ &amp; Cỡ Chữ</span>
      <div class="slider-group">
        <div class="slider-header">
          <span>Cỡ chữ tập đồ:</span>
          <span id="val-font-size">38 px</span>
        </div>
        <input type="range" id="slider-font-size" min="28" max="46" step="1" value="38">
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span>Kiểu đường kẻ:</span>
          <span id="val-ruling-type">Chuẩn 4 Dòng Kẻ</span>
        </div>
        <select id="select-ruling" class="select-input">
          <option value="4line" selected>4 Dòng Kẻ (Top, Mid đứt, Base đỏ, Descender)</option>
          <option value="2line">2 Dòng Kẻ Tối Giản (Mid đứt y=13, Base y=26)</option>
        </select>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span>Theme màu dòng kẻ:</span>
        </div>
        <select id="select-theme" class="select-input">
          <option value="primary" selected>🏫 Primary (Xanh dương &amp; Đỏ san hô)</option>
          <option value="vietnam_notebook">📘 Vở Ô Ly Tiểu Học (Xanh thiên thanh &amp; Mực xanh)</option>
          <option value="slate">🎨 Slate Tối Giản (Original)</option>
          <option value="candy">🌸 Pastel Candy (Hồng đào &amp; Xanh mint)</option>
        </select>
      </div>
    </div>

    <!-- BRAND POSITION SELECTOR -->
    <div class="control-section">
      <span class="section-label">🏷️ Vị Trí Chữ "Ms Linh English"</span>
      <select id="select-brand-position" class="select-input">
        <option value="bottom_right" selected>↘️ Dưới góc phải (Nhỏ gọn, tinh tế)</option>
        <option value="bottom_left">↙️ Dưới góc trái (Nhỏ gọn)</option>
        <option value="top_right">↗️ Góc trên bên phải (Nhỏ gọn)</option>
        <option value="top_center">🏷️ Tiêu đề lớn ở trên (Ban đầu)</option>
        <option value="none">🚫 Ẩn hoàn toàn (Không hiện tên)</option>
      </select>
    </div>

    <!-- TOGGLES -->
    <div class="control-section">
      <span class="section-label">⚙️ Tùy Chọn Bổ Trợ</span>
      <label class="checkbox-group">
        <input type="checkbox" id="check-arrows" checked>
        <span>Mũi tên hướng dẫn nét viết (Stroke arrows)</span>
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="check-characters" checked>
        <span>Nhân vật bé trai &amp; bé gái góc trang</span>
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="check-garden" checked>
        <span>Vườn hoa &amp; đám mây trang trí chân trang</span>
      </label>
    </div>
  </aside>

  <!-- PREVIEW PANEL -->
  <section class="preview-panel" id="preview-panel">
    <!-- Live sheets injected here -->
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
